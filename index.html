<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Galeria de fotos Continence Gallery hospedada no GitHub Pages.">
    <title>Continence 2026 | Fotos do evento</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="topbar" aria-label="Menu principal">
      <a class="brand" href="https://continence.com.br/" aria-label="Voltar para o site Continence">
        <img src="assets/logo-continence.png" alt="Continence 2026">
      </a>
      <a class="return-link" href="https://continence.com.br/">Retornar para o site</a>
    </nav>

    <header class="site-header">
      <div class="header-copy">
        <p class="eyebrow">Fotos do evento</p>
        <h1>Continence 2026</h1>
      </div>
      <div class="counter" aria-live="polite">
        <span id="photoCount">0</span>
        <small>fotos</small>
      </div>
    </header>

    <main>
      <section id="status" class="status" role="status">Carregando fotos do GitHub...</section>
      <section id="gallery" class="gallery" aria-label="Fotos"></section>
    </main>

    <dialog id="lightbox" class="lightbox" aria-label="Visualizacao da foto">
      <button id="closeLightbox" class="icon-button close-button" type="button" aria-label="Fechar">x</button>
      <button id="prevPhoto" class="icon-button nav-button prev-button" type="button" aria-label="Foto anterior">‹</button>
      <figure>
        <img id="lightboxImage" alt="">
        <figcaption id="lightboxCaption"></figcaption>
      </figure>
      <button id="nextPhoto" class="icon-button nav-button next-button" type="button" aria-label="Proxima foto">›</button>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
